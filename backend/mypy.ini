[mypy]
python_version = 3.13
strict = true
plugins = returns.contrib.mypy.returns_plugin
warn_return_any = true
warn_unused_configs = true

[mypy-asyncpg.*]
ignore_missing_imports = true

[mypy-lagom.*]
ignore_missing_imports = true

[mypy-duar_auth.*]
# follow_untyped_imports (not ignore_missing_imports): the SDK ships real .py
# source but no py.typed marker, so plain ignore_missing_imports erases every
# duar_auth symbol to Any — that would make the RequestAuth/AuthContext
# static compatibility check in infrastructure/duar/auth.py vacuous (Any
# satisfies anything). follow_untyped_imports makes mypy infer real types from
# the installed source instead, so the check is genuine.
follow_untyped_imports = true

[mypy-openpyxl.*]
ignore_missing_imports = true

[mypy-chemprop.*]
# chemprop ships no py.typed marker, and it is an optional extra: on the API tier and
# the default-lane worker it is not installed at all. Either way mypy has nothing to
# read, so the chemprop engine's imports resolve to Any -- which is honest, and matches
# how sklearn and xgboost already collapse in the ECFP4 engines.
ignore_missing_imports = true

# The rest of the gpu extra. With it installed these resolve to real types; without
# it (the API image, a CPU-only CI job, a venv after a bare `uv sync`) they are Any.
# `make lint` must pass in both venvs, so missing imports are tolerated here...
[mypy-torch.*]
ignore_missing_imports = true

[mypy-lightning.*]
ignore_missing_imports = true

[mypy-transformers.*]
ignore_missing_imports = true

# ...and the three gpu-lane modules may subclass those Any bases. The `type: ignore`
# comments inside them are needed with the extra installed and unused without it.
[mypy-daikonstudio.infrastructure.engines._lightning]
disallow_subclassing_any = false
warn_unused_ignores = false

[mypy-daikonstudio.infrastructure.engines.molformer_xl]
disallow_subclassing_any = false
warn_unused_ignores = false

[mypy-daikonstudio.infrastructure.engines.chemprop_dmpnn]
disallow_subclassing_any = false
warn_unused_ignores = false
