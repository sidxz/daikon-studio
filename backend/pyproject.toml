[project]
name = "daikonstudio"
version = "0.1.0"
description = "In-silico protocol studio (ML sibling of cellar)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.20",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "lagom>=2.7.0",
    "returns>=0.23.0",
    "duar-auth>=1.4.1",
    "pyjwt[crypto]>=2.14.0",
    "httpx>=0.28.0",
    "structlog>=24.4.0",
    "polars>=1.17",
    "pyarrow>=18.0",
    "rdkit>=2024.09",
    "scikit-learn>=1.6",
    "xgboost>=2.1",
    "lightgbm>=4.5",
    "fsspec>=2024.10",
    "joblib>=1.4",
    "openpyxl>=3.1",
    "umap-learn>=0.5.12",
]

[project.optional-dependencies]
# Networked blob backends. `BLOB_BASE_URL=file://...` needs neither.
s3 = ["s3fs>=2024.10"]
azure = ["adlfs>=2024.7"]
# The GPU lane. chemprop pulls torch, lightning and rdkit itself and owns their floors;
# torch is listed bare, with no version, only so [tool.uv.sources] below can pick its
# build (uv applies sources to direct dependencies only).
gpu = ["chemprop>=2.2,<3", "transformers>=4.44", "torch"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "testcontainers[postgres]>=4.0.0",
    "factory-boy>=3.3.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    "import-linter>=2.11",
    "respx>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/daikonstudio"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    # ponytail: fastapi.testclient.TestClient (the standard FastAPI test tool) wraps
    # httpx's sync API, which starlette flags as deprecated pending a hypothetical
    # "httpx2" that doesn't exist yet. Suppress only this exact warning so real
    # deprecations in test output still surface. Revisit once httpx2 ships.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated.*:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.importlinter]
root_packages = ["daikonstudio"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Clean Architecture layers"
type = "layers"
layers = [
    "daikonstudio.interface",
    "daikonstudio.infrastructure",
    "daikonstudio.application",
    "daikonstudio.domain",
]

[[tool.importlinter.contracts]]
name = "Domain purity"
type = "forbidden"
source_modules = ["daikonstudio.domain"]
forbidden_modules = [
    "daikonstudio.application",
    "daikonstudio.infrastructure",
    "daikonstudio.interface",
    "fastapi",
    "sqlalchemy",
    "asyncpg",
    "lagom",
    "httpx",
    "structlog",
    "polars",
    "rdkit",
    "sklearn",
    "xgboost",
    "lightgbm",
    "fsspec",
    "numpy",
]

[[tool.importlinter.contracts]]
name = "Bounded context independence"
type = "independence"
modules = [
    "daikonstudio.domain.catalog",
    "daikonstudio.domain.data",
    "daikonstudio.domain.execution",
]

# Linux x86_64 torch comes from PyTorch's CUDA 12.6 index, for the CUDA runner image
# (Dockerfile.gpu). PyPI's linux torch is built for CUDA 13, which needs NVIDIA driver
# 580+; atlantic's RTX 6000 Ada runs driver 555 (CUDA 12.5), where a cu130 torch cannot
# see the GPU and chemprop silently trains on CPU. cu126 runs on any 12.x driver (CUDA
# minor-version compatibility). Everywhere else -- a developer's Mac, reaching its GPU
# through MPS -- keeps the ordinary PyPI wheel. Move to a newer index only once every
# GPU host's driver supports it: `nvidia-smi` prints the highest CUDA the driver takes.
[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
