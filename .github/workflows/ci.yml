name: ci
on:
  push:
    branches: [main]
    # One namespace per component, versioned independently (RELEASING.md).
    tags: ['backend-v*.*.*', 'frontend-v*.*.*']
  pull_request:

permissions: { contents: read }

# Actions are pinned to commit SHAs (tag in the comment) so a moved tag cannot
# change what runs here. Bump one by resolving its tag again:
#   gh api repos/<owner>/<repo>/commits/<tag> --jq .sha
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with: { enable-cache: true }
      - run: uv sync --frozen --extra s3
      - run: uv run ruff check src tests && uv run ruff format --check src tests
      - run: uv run mypy src
      - run: uv run lint-imports
      # testcontainers needs the runner's Docker daemon, which ubuntu-latest has.
      - run: env OMP_NUM_THREADS=1 uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: 11.0.8 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec tsc --noEmit
      - run: pnpm test
      - run: pnpm build

  # Release tags only: pushes to main and PRs run the tests above and build nothing.
  images:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions: { contents: read, packages: write }
    env:
      API_IMAGE: ghcr.io/${{ github.repository }}/api
      FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/frontend
      # A component tag builds and publishes only that component.
      API: ${{ startsWith(github.ref_name, 'backend-v') }}
      FE: ${{ startsWith(github.ref_name, 'frontend-v') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 } # tags, so build-info.sh can `git describe`
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - id: ver
        # Single source of build identity (also what `make dev` exports).
        run: |
          scripts/build-info.sh backend | awk -F= -v OFS== '{$1="api_" tolower($1)}1' >> "$GITHUB_OUTPUT"
          scripts/build-info.sh frontend | awk -F= -v OFS== '{$1="fe_" tolower($1)}1' >> "$GITHUB_OUTPUT"
      - name: Build the API image
        if: env.API == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: backend
          file: backend/Dockerfile
          load: true
          tags: daikon-runner:cpu
          # Layer cache in GitHub's cache service: without it every run rebuilt and
          # re-pushed the multi-GB dependency layers even when uv.lock had not changed.
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
          build-args: |
            APP_VERSION=${{ steps.ver.outputs.api_version }}
            APP_GIT_SHA=${{ steps.ver.outputs.api_git_sha }}
            APP_BUILD_DATE=${{ steps.ver.outputs.api_build_date }}
      # A green build says nothing about whether the image works (docs/roadmap.md).
      - name: Boot-check the API image
        if: env.API == 'true'
        run: docker run --rm -e STUDIO_DUAR_SERVICE_KEY=smoke -e STUDIO_IDP_AUDIENCE=smoke daikon-runner:cpu python -c "import daikonstudio.interface.app, daikonstudio.infrastructure.engines.registry as r; print(sorted(m.id for m in r.default_registry().manifests()))"
      - name: Build the frontend image
        if: env.FE == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: frontend
          file: frontend/Dockerfile
          load: true
          tags: daikon-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          build-args: |
            APP_VERSION=${{ steps.ver.outputs.fe_version }}
            APP_GIT_SHA=${{ steps.ver.outputs.fe_git_sha }}
            APP_BUILD_DATE=${{ steps.ver.outputs.fe_build_date }}
      - name: Boot-check the frontend image
        if: env.FE == 'true'
        run: |
          docker run -d --name fe -p 3000:3000 daikon-frontend:ci && sleep 4
          curl -fsS http://localhost:3000/api/config >/dev/null && curl -fsSI http://localhost:3000/RDKit_minimal.wasm >/dev/null
      # Push events are main or a component tag; pull requests only build.
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: github.event_name == 'push'
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Push
        if: github.event_name == 'push'
        env:
          API_VERSION: ${{ steps.ver.outputs.api_version }}
          FE_VERSION: ${{ steps.ver.outputs.fe_version }}
        run: |
          # A release tag X.Y.Z: X.Y.Z, X.Y, X and latest; a pre-release (X.Y.Z-beta.1)
          # only its exact version. Every push also gets the commit sha.
          # A release moves latest too, now that main no longer publishes it.
          tags_for() {
            case "$1" in *-*) echo "$1" ;; *) echo "$1 ${1%.*} ${1%%.*} latest" ;; esac
          }
          publish() { # local image, remote image, version
            for t in $(tags_for "$3") "$GITHUB_SHA"; do docker tag "$1" "$2:$t"; done
            docker push --all-tags "$2"
          }
          if [ "$API" = true ]; then publish daikon-runner:cpu "$API_IMAGE" "$API_VERSION"; fi
          if [ "$FE" = true ]; then publish daikon-frontend:ci "$FRONTEND_IMAGE" "$FE_VERSION"; fi

  release:
    runs-on: ubuntu-latest
    needs: [images]
    if: github.ref_type == 'tag'
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Publish the GitHub Release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          NS="${GITHUB_REF_NAME%%-v*}" # backend | frontend
          # Previous same-namespace tag by creation date (assumes tags are created in version order).
          PREV="$(git tag --list "${NS}-v*" --sort=-creatordate | sed -n '2p')"
          # git-cliff takes a range, not a lone tag: with no previous tag, pass none,
          # which is everything up to HEAD (the tagged commit).
          uvx git-cliff@2.14.2 --include-path "${NS}/**" ${PREV:+"$PREV..$GITHUB_REF_NAME"} > CHANGES.md
          # "backend-v1.4.0" -> "Backend v1.4.0"
          TITLE="$(printf '%s' "$NS" | sed 's/^./\U&/') ${GITHUB_REF_NAME#"$NS"-}"
          gh release create "$GITHUB_REF_NAME" --title "$TITLE" --notes-file CHANGES.md
