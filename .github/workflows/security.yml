name: security
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Monday 06:00 UTC. A lockfile that was clean when it merged does not stay
    # clean -- most findings here arrive with a new advisory, not a new commit.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions: { contents: read }

# Actions are pinned to commit SHAs (tag in the comment) so a moved tag cannot
# change what runs here, matching ci.yml. Bump one by resolving its tag again:
#   gh api repos/<owner>/<repo>/commits/<tag> --jq .sha
jobs:
  # The same bar as `make security-scan`'s first command, run on every push
  # instead of only when someone remembers it before a release tag. The image
  # half of that target is deliberately not here: it builds the runner and
  # frontend images, which is minutes, and its findings come from the base
  # image rather than the commit. `make security-scan` stays the release gate
  # (RELEASING.md); this is the thing that catches a bad lockfile on the day it
  # lands rather than on the day someone tries to cut a release.
  filesystem:
    name: Trivy filesystem (lockfiles + secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          # Unfixable findings cannot be actioned by a bump, and failing on them
          # would mean a red gate nobody can turn green.
          ignore-unfixed: true
          exit-code: 1
          # Mirrors the Makefile target's list. docs/ and internal-docs/ are
          # gitignored and absent here; the rest are build output and caches.
          skip-dirs: "**/node_modules,**/.venv,**/.next,**/.blobs,**/.logs"
