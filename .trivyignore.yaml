# Findings the scan gate is told to pass. Each one carries why, and a date to revisit.
# The reasoning behind this file lives in RELEASING.md under "The p2rank findings";
# read that before adding to it.
#
# Everything here ships inside p2rank 2.5.1, the second pocket finder. We do not build
# those jars: p2rank is fetched as a released tarball, pinned by checksum, and its
# bin/lib is its own. Upgrading does not help -- 2.6-alpha scanned as an image carried
# eighteen findings against 2.5.1's eight when both were measured on 2026-10-25 -- so the
# only real fixes are a stable upstream release or dropping p2rank. 2.5.1 is at ten as of
# 2026-11-17: the tarball is pinned, the advisories against it are not.
#
# Why this is acceptable, stated so a reader can disagree rather than take it on faith:
# p2rank runs as a subprocess over a prepared PDB this product wrote, inside a runner,
# and its jackson parses p2rank's own configuration and model files. Nothing routes a
# scientist's upload into it. The denial-of-service entries cost a failed step. The
# deserialisation entries need attacker-controlled polymorphic JSON, which never
# arrives. That argument stops holding the moment p2rank is handed untrusted JSON or
# put on a network, which is why every entry expires rather than sitting here forever.
#
# Accepted by Sid on 2026-10-25 for the first eight, and on 2026-11-17 for the two added
# below. Revisit at expiry, or sooner if p2rank publishes a stable release after 2.5.1.
vulnerabilities:
  - id: CVE-2025-52999
    statement: jackson-core 2.13.4, vendored in p2rank 2.5.1. Stack overflow on deeply nested input.
    expired_at: 2026-12-31
  - id: CVE-2026-68494
    statement: jackson-core 2.13.4, vendored in p2rank 2.5.1.
    expired_at: 2026-12-31
  - id: CVE-2026-89425
    statement: jackson-core 2.13.4, vendored in p2rank 2.5.1. Denial of service.
    expired_at: 2026-12-31
  - id: CVE-2026-54512
    statement: jackson-databind 2.13.4.2, vendored in p2rank 2.5.1. Needs attacker-controlled polymorphic JSON, which nothing here supplies.
    expired_at: 2026-12-31
  - id: CVE-2026-54513
    statement: jackson-databind 2.13.4.2, vendored in p2rank 2.5.1. As above.
    expired_at: 2026-12-31
  - id: CVE-2026-91776
    statement: jackson-databind 2.13.4.2, vendored in p2rank 2.5.1.
    expired_at: 2026-12-31
  - id: CVE-2026-91777
    statement: jackson-databind 2.13.4.2, vendored in p2rank 2.5.1.
    expired_at: 2026-12-31
  - id: CVE-2026-21452
    statement: msgpack-core 0.8.24, vendored in p2rank 2.5.1. Denial of service on malformed input.
    expired_at: 2026-12-31
  # Added 2026-11-17, found when the chem image was scanned for the release that first
  # publishes it. Same tarball, same argument, same expiry -- but the count went from
  # eight to ten in three weeks, which is the drift the expiry exists to surface.
  - id: CVE-2026-102554
    statement: guava 33.4.8-jre, vendored in p2rank 2.5.1. Denial of service via unthrottled allocation while deserialising; p2rank deserialises only its own model files.
    expired_at: 2026-12-31
  - id: CVE-2026-63436
    statement: zt-zip 1.17, vendored in p2rank 2.5.1. Path traversal when unpacking an archive; p2rank unpacks only its bundled models, and nothing here hands it a scientist's archive.
    expired_at: 2026-12-31
